services:
  postgres:
    image: postgres:16-alpine
    container_name: site-ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: site_ticket
      POSTGRES_USER: site_ticket
      POSTGRES_PASSWORD: site_ticket
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: site-ticket-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: